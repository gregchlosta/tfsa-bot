[project]
name = "tfsa-bot"
version = "0.1.0"
description = "Weekly trend-following signals for a Wealthsimple TFSA, with a news check and an MCP server"
readme = "README.md"
authors = [
    { name = "Greg Chlosta", email = "grzegorz.chlosta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "yfinance>=1.8.0",
]

[project.scripts]
tfsa-bot = "tfsa_bot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
